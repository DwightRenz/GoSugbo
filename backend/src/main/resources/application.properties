spring.application.name=GoSugbo

# Load .env from the project root
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# JWT (no default on purpose: the app refuses to start without JWT_SECRET)
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=gosugbo-api
app.jwt.expiration-minutes=60

# true = riders can log in right after registering; false = 'pending' until an admin activates them
app.auth.rider-auto-approve=true

# First admin, created at startup only if no admin exists. Leave email blank to disable.
app.bootstrap-admin.email=${ADMIN_EMAIL:}
app.bootstrap-admin.password=${ADMIN_PASSWORD:}
app.bootstrap-admin.full-name=System Admin

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method